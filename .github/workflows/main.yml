 name: Auto Restart and Keep Codespace Active

on:
  schedule:
    - cron: '*/5 * * * *'  # Changed to every 5 minutes (more reasonable)
  workflow_dispatch:  # Allows manual triggering

jobs:
  restart_codespace:
    runs-on: ubuntu-latest
    steps:
      - name: Install GitHub CLI and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y gh jq

      - name: Authenticate GitHub CLI
        run: |
          echo "${{ secrets.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}}" | gh auth login --with-token

      - name: Check Codespace Status and Keep Alive
        run: |
          CODESPACE_NAME="jubilant-telegram-97jwr5jj47wp2977"
          STATUS=$(gh codespace list --json name,state | jq -r --arg name "$CODESPACE_NAME" '.[] | select(.name == $name) | .state')
          
          if [ -z "$STATUS" ]; then
            echo "Error fetching codespace status or codespace does not exist."
            exit 1
          fi
          
          echo "Codespace status: $STATUS"
          
          if [ "$STATUS" == "Shutdown" ] || [ "$STATUS" == "Unknown" ]; then
            echo "Codespace is offline. Starting it..."
            gh codespace start --codespace "$CODESPACE_NAME"
          else
            echo "Codespace is active. Sending keep-alive signal..."
            # Just attempt SSH to keep it alive
            gh codespace ssh --codespace "$CODESPACE_NAME" --command "echo 'Keep-alive at $(date)'" || true
          fi
