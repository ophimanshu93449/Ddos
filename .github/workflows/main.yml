name: Auto Restart Codespace
on:
  schedule:
    - cron: '*/1* * * *' # Recommended minimum: 10 minutes
  workflow_dispatch:

jobs:
  restart_codespace:
    runs-on: ubuntu-latest
    steps:
    - name: Start Codespace
      env:
        GH_TOKEN: "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" # Use a secret, not hardcoded text
        CODESPACE_NAME: "fuzzy-computing-machine-pjpjvv55rvjg276wg"
      run: |
        # Use the dedicated start command instead of SSH for restarting
        gh codespace start --codespace "$CODESPACE_NAME"
        
        # Verify it is running
        STATUS=$(gh codespace list --json name,state | jq -r --arg name "$CODESPACE_NAME" '.[] | select(.name == $name) | .state')
        echo "Current status: $STATUS"
