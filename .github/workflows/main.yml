name: Auto Restart and Keep Codespace Active

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch:  # Allows manual triggering

jobs:
  restart-codespace:
    runs-on: ubuntu-latest
    
    steps:
      - name: Install GitHub CLI and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y gh jq

      - name: Authenticate GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.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 }}
        run: |
          echo "$GH_TOKEN" | gh auth login --with-token

      - name: Check Codespace Status
        id: check-status
        env:
          GH_TOKEN: ${{ secrets.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 }}
        run: |
          CODESPACE_NAME="jubilant-telegram-97jwr5jj47wp2977"
          STATUS=$(gh codespace list --json name,state | jq -r --arg name "$CODESPACE_NAME" '.[] | select(.name == $name) | .state')
          
          if [ -z "$STATUS" ]; then
            echo "Error: Could not find codespace '$CODESPACE_NAME'"
            echo "status=not_found" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo "Codespace status: $STATUS"
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          
          if [ "$STATUS" == "Available" ] || [ "$STATUS" == "Created" ]; then
            echo "action=keepalive" >> $GITHUB_OUTPUT
          else
            echo "action=restart" >> $GITHUB_OUTPUT
          fi

      - name: Keep Codespace Alive
        if: steps.check-status.outputs.action == 'keepalive'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          CODESPACE_NAME="jubilant-telegram-97jwr5jj47wp2977"
          echo "Sending keep-alive signal..."
          # Try to run a simple command via SSH
          gh codespace ssh --codespace "$CODESPACE_NAME" --command "echo 'Keep-alive at $(date)'" || echo "SSH command failed (codespace might be starting)"

      - name: Restart Codespace
        if: steps.check-status.outputs.action == 'restart'
        env:
          GH_TOKEN: ${{ secrets.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 }}
        run: |
          CODESPACE_NAME="jubilant-telegram-97jwr5jj47wp2977"
          echo "Starting codespace..."
          gh codespace start --codespace "$CODESPACE_NAME"
