name: 24-7 Codespace Keep-Alive
on:
  schedule:
    # Runs every 2 hours to prevent the 4-hour max timeout
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  ping-codespace:
    runs-on: ubuntu-latest
    steps:
      - name: Restart Specific Codespace
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          CODESPACE_NAME: "jubilant-telegram-97jwr5jj47wp2977"
        run: |
          echo "Starting codespace: $CODESPACE_NAME"
          gh codespace rebuild --codespace $CODESPACE_NAME
